<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>結婚ロードマップの残り確認</title>
<style>
  :root{--bg:#0f0d0a;--card:#1c1710;--line:#38301e;--cream:#ece4d2;--dim:#b8ae97;--gold:#d4a017;--ok:#7bc47f;--warn:#e8a948}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.8}
  main{max-width:560px;margin:0 auto;padding:28px 16px 48px}
  h1{font-size:20px;margin:0 0 12px;color:var(--gold)}
  p{margin:0 0 12px}
  .note{font-size:13px;color:var(--dim)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin:18px 0}
  .big{font-size:18px;font-weight:700;margin:0 0 6px}
  .ok{color:var(--ok)} .warn{color:var(--warn)}
  ul{margin:8px 0 0;padding-left:20px;font-size:14px;color:var(--dim)}
  button{display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;background:var(--gold);color:#0f0d0a;font-size:16px;font-weight:700}
  button:disabled{opacity:.5}
</style>
</head>
<body>
<main>
  <h1>結婚ロードマップの残り確認</h1>
  <p>10月6日〜8日、結婚ロードマップが一時的にこの住所（sauna-cospa.com）で開かれていました。その間にこの端末へ残ったものを調べます。</p>
  <p class="note">調べるのはこの端末の中だけです。中身はどこにも送りません。</p>
  <div class="card" id="result"><p>確認中…</p></div>
  <p class="note">結婚ロードマップは、これまでどおり kenji0618y.github.io/kekkon-roadmap/ で使えます。</p>
</main>
<script>
(async function(){
  var KEYS=['futari-miraicho-v1','futari-gist-sync-v2','futari-gist-sync-v1','futari-me-v1','futari-timer-v1','amity-chat-v1','desk-chan-chat-v1','desk-board-seen-v1','board-line-secret-v1','login-line-sent-v1','stamp-line-sent-v1','amity-grok-key'];
  var box=document.getElementById('result');
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function stored(k){try{return localStorage.getItem(k);}catch(e){return null;}}

  var keysFound=KEYS.filter(function(k){return stored(k)!==null;});
  var bookRaw=stored('futari-miraicho-v1');
  var savedAt='';
  if(bookRaw){try{var d=JSON.parse(bookRaw);savedAt=d&&d.savedAt?new Date(d.savedAt).toLocaleString('ja-JP'):'';}catch(e){savedAt='（読めませんでした）';}}
  var hasSync=stored('futari-gist-sync-v2')!==null||stored('futari-gist-sync-v1')!==null;

  var dbListed=false,hasLock=false;
  try{if(indexedDB&&indexedDB.databases){var dbs=await indexedDB.databases();dbListed=true;hasLock=dbs.some(function(x){return x&&x.name==='site-lock';});}}catch(e){}
  var regs=[];
  try{if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){regs=(await navigator.serviceWorker.getRegistrations()).filter(function(r){return r.scope.indexOf('/kekkon-roadmap/')>=0;});}}catch(e){}
  var cacheNames=[];
  try{if(window.caches){cacheNames=(await caches.keys()).filter(function(n){return n.indexOf('kekkon-roadmap')>=0;});}}catch(e){}

  if(bookRaw){
    box.innerHTML='<p class="big warn">手帳の記録が残っています</p>'+
      '<p>最終保存：'+esc(savedAt||'不明')+'<br>同期の設定：'+(hasSync?'あり（同期先にも送られている可能性があります）':'なし')+'</p>'+
      '<p>消さずに、この画面のスクリーンショットをClaudeに送ってください。安全に取り出す方法を用意します。</p>';
    return;
  }

  var leftovers=keysFound.length+(hasLock?1:0)+regs.length+cacheNames.length;
  var unknownDb=!dbListed;
  if(leftovers===0&&!unknownDb){
    box.innerHTML='<p class="big ok">✓ 何も残っていません</p><p>取り出すものも、消すものもありません。このページは閉じて大丈夫です。</p>';
    return;
  }

  var items=[];
  if(keysFound.length)items.push('設定 '+keysFound.length+'件（手帳の記録ではありません）');
  if(hasLock)items.push('合言葉の鍵');
  if(regs.length||cacheNames.length)items.push('アプリの一時保存');
  if(unknownDb&&!hasLock)items.push('合言葉の鍵（この端末では有無を確認できないため、念のため消します）');
  box.innerHTML='<p class="big ok">✓ 手帳の記録は残っていません</p>'+
    '<p>取り出すものはありません。ただ、この住所側に次のものが残っています。</p><ul>'+
    items.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>'+
    '<p class="note" style="margin-top:12px">本来の住所（kenji0618y.github.io）側には別にちゃんとあるので、ここの分を消しても結婚ロードマップには影響しません。</p>'+
    '<button id="clean" type="button">ここに残った分を消す</button>';
  document.getElementById('clean').addEventListener('click',async function(){
    this.disabled=true;
    KEYS.forEach(function(k){try{localStorage.removeItem(k);}catch(e){}});
    try{indexedDB.deleteDatabase('site-lock');}catch(e){}
    for(var i=0;i<regs.length;i++){try{await regs[i].unregister();}catch(e){}}
    for(var j=0;j<cacheNames.length;j++){try{await caches.delete(cacheNames[j]);}catch(e){}}
    box.innerHTML='<p class="big ok">✓ 消しました</p><p>この端末の sauna-cospa.com 側はきれいになりました。このページは閉じて大丈夫です。</p>';
  });
})();
</script>
</body>
</html>
